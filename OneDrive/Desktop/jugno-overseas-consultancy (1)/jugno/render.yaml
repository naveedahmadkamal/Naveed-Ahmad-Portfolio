services:
  - type: web
    name: jugno-overseas-consultancy
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: attach a Render PostgreSQL database and set DATABASE_URL
      # to its connection string to move off SQLite in production.
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: jugno-db
      #     property: connectionString
